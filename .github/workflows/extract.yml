name: Extract Native Apple CoreImage iOS LUTs and Lightroom XMPs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  extract-on-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Extract 3D .cube LUTs from Apple CoreImage
        run: |
          swift extract_ios_luts.swift

      - name: 2. Pack .cube 3D LUTs into Lightroom Mobile .xmp Profiles & Presets
        run: |
          python3 cube_to_xmp.py

      - name: 3. Upload All LUTs and XMPs as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iOS_Authentic_LUTs_and_Lightroom_XMPs
          path: |
            output_cubes/*.cube
            output_xmp_profiles/*.xmp
            output_xmp_presets/*.xmp
            
